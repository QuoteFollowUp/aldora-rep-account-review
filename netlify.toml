[build]
  publish = "."
  functions = "netlify/functions"
  # No build step: this overrides any build command typed in the Netlify UI.
  command = "echo 'No build step'"

[functions]
  node_bundler = "esbuild"

# Always fetch the newest app page so every phone runs the latest version.
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"
