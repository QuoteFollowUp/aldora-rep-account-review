[build]
  publish = "."
  functions = "netlify/functions"
  # No build step: this overrides any build command typed in the Netlify UI.
  command = "echo 'No build step'"

[functions]
  node_bundler = "esbuild"

# Always fetch the newest app page so every phone runs the latest version.
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

# Keep server code and config files off the public site (pages and /api/* still work).
[[redirects]]
  from = "/netlify/*"
  to = "/not-found"
  status = 404
  force = true
[[redirects]]
  from = "/package.json"
  to = "/not-found"
  status = 404
  force = true
[[redirects]]
  from = "/netlify.toml"
  to = "/not-found"
  status = 404
  force = true
[[redirects]]
  from = "/README.md"
  to = "/not-found"
  status = 404
  force = true
[[redirects]]
  from = "/reps.mjs"
  to = "/not-found"
  status = 404
  force = true
